# CI — the final check before you merge a PR into main (installed by ock new).
# The job is named `check`; the main-branch ruleset requires it to pass.
#   1. OpenSpec: everything validates, archived changes have every task done, and the PR leaves no
#      unarchived change behind (/ship archives them — a PR opened another way gets told so).
#   2. scripts/check.sh: the project's own tests/lint/build — the same script `ock check` runs locally.
name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  OPENSPEC_VERSION: "2.1.1"
  OPENSPEC_TELEMETRY: "0"
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: OpenSpec
        if: hashFiles('openspec/config.yaml') != ''
        run: |
          npm install -g --no-fund --no-audit "@fission-ai/openspec@${OPENSPEC_VERSION}" >/dev/null
          openspec validate --all --no-interactive
          if [ -n "$(ls -A openspec/changes/archive 2>/dev/null | grep -v '^.gitkeep$' || true)" ]; then
            openspec validate --archived --no-interactive
          fi
          base="origin/${GITHUB_BASE_REF:-main}"
          left="$(git diff --name-only "$base...HEAD" -- openspec/changes \
            | awk -F/ '$3 != "archive" && NF >= 4 { print $3 }' | sort -u \
            | while read -r id; do [ -d "openspec/changes/$id" ] && echo "$id"; done || true)"
          if [ -n "$left" ]; then
            echo "::error::Unarchived OpenSpec change(s) in this PR: $left — ship with ock ship (it checks the tasks and archives them)"
            exit 1
          fi
      - name: Project checks (scripts/check.sh)
        run: |
          if [ -x scripts/check.sh ]; then ./scripts/check.sh
          else echo "::warning::no scripts/check.sh — the project has no checks yet"; fi

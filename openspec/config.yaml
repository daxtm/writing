schema: spec-driven

# Project context: facts not obvious from an individual code section.
context: |
  Project: longform.py helps writers plan and collaboratively draft long-form fiction using Featherless.ai.
  Stack: CPython 3.13 minor pinned by .python-version (cpython@3.13) and mirrored as PEP 723 requires-python ">=3.13,<3.14" in longform.py/longform_core/cli.py; patch updates within 3.13 are automatic and a minor bump is one reviewed pin/mirror change (ADR-0013); argparse, uv with PEP 723 inline httpx>=0.27 and pyside6>=6.12.0,<6.13; JSON/Markdown project files, no database.
  Runs on: Local CLI via uv run --script longform.py, native Wayland GUI via QT_QPA_PLATFORM=wayland uv run --script longform.py gui DIR, and a frozen Linux executable built by scripts/build-standalone.sh; no hosted CI workflow.
  Android target (roadmap only): Owner requests full CLI/desktop feature parity delivered as a signed APK. docs/ROADMAP.md Android milestone 1 is android-apk-project-shell, android-project-transfer, android-steered-drafting (install/import/credentials/streamed Generate/Accept/export/reopen); milestone 2 is android-guided-planning, android-draft-feature-parity, android-review-export-parity, android-apk-parity-release (complete guided workflow, every parity-map action and owner-signed APK handoff). No Android implementation, build commands, APK or OpenSpec changes exist yet; select changes for build individually.
  Android architecture: ADR-0014 chooses Kotlin/Jetpack Compose with Chaquopy-embedded CPython 3.13 and existing Qt-independent operations/httpx/resources, not PySide6, the uv launcher, terminal automation, a companion server or duplicated writing rules. API 24+, arm64-v8a devices and x86_64 emulator coverage; release application ID com.daxtm.writing, debug suffix .debug. Lock a tested compatible Android toolchain in the skeleton. Root .python-version remains the minor authority; Android embedded patches come from reviewed runtime distributions and are recorded, not provisioned by host uv. Release signing material stays external; automated release-mode checks use synthetic signing.
  Android persistence/lifecycle: ADR-0015 chooses app-private ordinary project directories and explicit system-picker ZIP/resource/manuscript transfer, not live URI-backed editing or sync. Preserve existing formats/branches/history, validate staged archives and external dependencies, strip credentials from transfer snapshots without changing source projects, exclude private state from automatic backup/device transfer, and warn uninstall removes unexported projects. Reuse ADR-0011 session/explicit plaintext project-key actions, not a new keyring. ADR-0016 chooses one process-owned non-Qt runner, rotation reattachment, cooperative Stop on background, no promised background completion or paid replay after restart; recover saved artifacts without accepting provisional output.
  Android acceptance: Every CLI/desktop parity row plus defaults/wizard/credentials/streaming is required; layout/platform mechanisms may differ, not prompts/samplers/writing/file semantics. Add offline packaged embedded-core/JVM/emulator parity and lifecycle/transfer/upgrade cases to scripts/check.sh without replacing desktop checks; required tooling/tests cannot silently skip. Real ARM64 device and owner-signing evidence remains PENDING until recorded. Planned Android build interfaces in the roadmap are not available commands. No iOS, Play/AAB publishing, cloud sync, unattended generation, new provider capability or desktop shipping authorization.
  Current implementation: Qt Widgets GUI with Plan/Write/Review/Export stages, reader_model snapshots, shared draft/planning/review operations and one worker are integrated. Create uses shared create-missing-only init with reviewed full defaults and the bundled preset; setup and the guided wizard provide masked session/project credentials with explicit Test connection; every generated answer and candidate streams live previews. ADR-0006 supersedes the integrated Tk reader decision; ADR-0007 governs shared operations and the worker.
  Next desktop target: docs/ROADMAP.md Guided writing workflow is implemented on feat/guided-workflow (unshipped). Milestone 1 is project-defaults-full-init, gui-api-key-setup, gui-generated-text-streaming (initialized project to live outline); milestone 2 is gui-workflow-navigation, gui-project-setup-wizard (guided bible/outline/scenes through writing/review/export). ADR-0010 selects reviewed bundled defaults/shared full init; ADR-0011 selects session credentials or explicit plaintext project api_key saves, not a new keyring; ADR-0012 selects shared incremental answer events for all operations/candidates. All five change task lists are checked; offline parity/offscreen journeys pass. Real Wayland acceptance remains PENDING in each change's evidence.md; do not claim completion or ship.
  GUI delivery: preserve CLI prompts, sampling and file formats; reuse Project/Tree/Lore/Api and reader snapshots, not terminal automation or duplicated prompts. Keep Qt imports lazy. Tests use fake providers, temporary projects and existing network guards; operation/model tests are headless, Qt widget tests use offscreen execution, and actual Wayland/compositor/scaling acceptance is separate. Every new behavior must be covered by scripts/check.sh.
  Roadmap process: create OpenSpec changes only when selected for build; no new change artifacts for the roadmap itself. ADR-0004/0005 are already integrated; next ADR number follows docs/adr/README.md. The new owner request supersedes the old stop-planning instruction, not the no-shipping rule or pending real Wayland acceptance.
  Defaults sources: /home/daxtm/Documents/fuckpi/project.json and /home/daxtm/Documents/fuckpi/56295265-LLam_ception-1.3.json are read-only references for preparing reviewed runtime defaults, never runtime/build/test dependencies. Strip credentials/private values, force empty api_key, FEATHERLESS_API_KEY variable name and project-relative writer_preset.json. Original files remain untracked, never fixtures; only sanitized application-owned runtime assets may be bundled under ADR-0010. Init creates local files/directories/preset, not paid planning output. Bible answering currently composes local forms without a provider call.
  Constraints: Offline deterministic tests with MockTransport/fakes, never live API calls; dependency provisioning may use network. Never commit API keys or .env. Keep private generated myfic/ and original third-party preset JSON untracked and out of fixtures. Keep longform.py as a thin PEP 723 launcher over longform_core (ADR-0003); preserve existing projects/prompts/samplers/file formats and CLI transcripts, except intentional new-project default changes selected under ADR-0010; GUI credential entry and answer streaming follow ADR-0011/0012. scripts/check.sh runs syntax/help, frozen-executable build/tests (uv and cc required), then remaining source/offscreen Qt tests; missing required dependencies fail rather than skip. Checks run locally (ock check, ock ship).
  The owner reviews behavior and output rather than code: plain language, observable results.

rules:
  proposal:
    - Under 300 words, plain language; "Why" is at least two full sentences
    - State what is out of scope
    - Say how the owner will see it work (a command to run and the output to expect)
  specs:
    - A new capability's delta spec starts with "## Purpose" — one sentence of at least 60 characters
    - Every requirement has a WHEN/THEN scenario a test can check
    - Describe observable behavior, not implementation
  design:
    - Only decisions that matter; anything costly to reverse gets an ADR in docs/adr/
    - Simplest approach that meets the spec; no speculative features
  tasks:
    - The first task is a failing test of the behavior the owner will observe
    - Each task is one small commit; its test sits right next to it
    - The last task makes scripts/check.sh cover the new behavior and pass
    - At most ~8 tasks; bigger means split the change

operations:
  archive:
    guidance:
      - Summarize what shipped in two or three plain sentences

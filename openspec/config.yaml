schema: spec-driven

# Project context: facts not obvious from an individual code section.
context: |
  Project: longform.py helps writers plan and collaboratively draft long-form fiction using Featherless.ai.
  Stack: Python 3.11+, argparse, uv with PEP 723 inline httpx>=0.27 and pyside6>=6.12.0,<6.13; JSON/Markdown project files, no database.
  Runs on: Local CLI via uv run --script longform.py, native Wayland GUI via QT_QPA_PLATFORM=wayland uv run --script longform.py gui DIR, and a frozen Linux executable built by scripts/build-standalone.sh; no hosted CI workflow.
  Current implementation: Qt Widgets GUI, reader_model snapshots, shared draft/planning/review operations and one worker are integrated. Create uses shared create-missing-only init but supplies no default preset; credential forms show availability only. Api already streams at transport level, while planning/review and multi-candidate UI previews largely wait for completed text. ADR-0006 supersedes the integrated Tk reader decision; ADR-0007 governs shared operations and the worker.
  Next desktop target: docs/ROADMAP.md Guided writing workflow is roadmap-only. Milestone 1 is project-defaults-full-init, gui-api-key-setup, gui-generated-text-streaming (initialized project to live outline); milestone 2 is gui-workflow-navigation, gui-project-setup-wizard (guided bible/outline/scenes through writing/review/export). ADR-0010 selects reviewed bundled defaults/shared full init; ADR-0011 selects session credentials or explicit plaintext project api_key saves, not a new keyring; ADR-0012 selects shared incremental answer events for all operations/candidates. These behaviors are not implemented by this roadmap.
  GUI delivery: preserve CLI prompts, sampling and file formats; reuse Project/Tree/Lore/Api and reader snapshots, not terminal automation or duplicated prompts. Keep Qt imports lazy. Tests use fake providers, temporary projects and existing network guards; operation/model tests are headless, Qt widget tests use offscreen execution, and actual Wayland/compositor/scaling acceptance is separate. Every new behavior must be covered by scripts/check.sh.
  Roadmap process: create OpenSpec changes only when selected for build; no new change artifacts for the roadmap itself. ADR-0004/0005 are already integrated; next ADR number follows docs/adr/README.md. The new owner request supersedes the old stop-planning instruction, not the no-shipping rule or pending real Wayland acceptance.
  Defaults sources: /home/daxtm/Documents/fuckpi/project.json and /home/daxtm/Documents/fuckpi/56295265-LLam_ception-1.3.json are read-only references for preparing reviewed runtime defaults, never runtime/build/test dependencies. Strip credentials/private values, force empty api_key, FEATHERLESS_API_KEY variable name and project-relative writer_preset.json. Original files remain untracked, never fixtures; only sanitized application-owned runtime assets may be bundled under ADR-0010. Init creates local files/directories/preset, not paid planning output. Bible answering currently composes local forms without a provider call.
  Constraints: Offline deterministic tests with MockTransport/fakes, never live API calls; dependency provisioning may use network. Never commit API keys or .env. Keep private generated myfic/ and original third-party preset JSON untracked and out of fixtures. Keep longform.py as a thin PEP 723 launcher over longform_core (ADR-0003); preserve existing projects/prompts/samplers/file formats and CLI transcripts, except intentional new-project default changes selected under ADR-0010. scripts/check.sh runs syntax/help, frozen-executable build/tests (uv and cc required), then remaining source/offscreen Qt tests; missing required dependencies fail rather than skip. Checks run locally (ock check, ock ship).
  The owner reviews behavior and output rather than code: plain language, observable results.

rules:
  proposal:
    - Under 300 words, plain language; "Why" is at least two full sentences
    - State what is out of scope
    - Say how the owner will see it work (a command to run and the output to expect)
  specs:
    - A new capability's delta spec starts with "## Purpose" — one sentence of at least 60 characters
    - Every requirement has a WHEN/THEN scenario a test can check
    - Describe observable behavior, not implementation
  design:
    - Only decisions that matter; anything costly to reverse gets an ADR in docs/adr/
    - Simplest approach that meets the spec; no speculative features
  tasks:
    - The first task is a failing test of the behavior the owner will observe
    - Each task is one small commit; its test sits right next to it
    - The last task makes scripts/check.sh cover the new behavior and pass
    - At most ~8 tasks; bigger means split the change

operations:
  archive:
    guidance:
      - Summarize what shipped in two or three plain sentences
